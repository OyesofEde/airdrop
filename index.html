<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Airdrop List" />
    <meta property="og:desciption" content="In the Casino" />
    <meta property="og:url" content="https://oyesofede.github.io/airdrop/" />

    <title>Alpha Playbook</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Custom animation for spin-slow since Tailwind default spin is fast */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 3s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-purple-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- ICONS (Inline SVGs to remove dependency on external icon libraries) ---
        const IconRocket = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
        );
        const IconSearch = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );
        const IconFilter = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        );
        const IconExternalLink = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        );
        const IconRefresh = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        );
        const IconCheck = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        );
        const IconClock = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );
        const IconAlert = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        );
        // Added the missing Sheet Icon here
        const IconSheet = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        );

        // --- DATA ---
        const INITIAL_DATA = [
            { id: 1, name: "ETHOS", link: "https://app.ethos.network/", status: "ongoing", interaction: "Daily checkin, connect with people so they can review you", help: "If you don't have invite, trynna get it" },
            { id: 2, name: "Edgen", link: "https://www.edgen.tech/aura/block_piffer", status: "ongoing", interaction: "General interaction", help: "Check-ins, and X tasks" },
            { id: 3, name: "Noise", link: "https://app.noise.xyz/discover", status: "onhold", interaction: "Just long and short the mindshare", help: "Wait for s2" },
            { id: 4, name: "Orbt", link: "https://defi.orbt.xyz?referral_code=CIS-XJR-VJK-D9L", status: "ongoing", interaction: "Do the tasks", help: "The higher your onchain signal, the higher the points" },
            { id: 5, name: "Glider", link: "https://glider.fi/dashboard", status: "ongoing", interaction: "Deposit money, the more the amount the more the points", help: "" },
            { id: 6, name: "Dabba", link: "https://app.galxe.com/quest/dabbanetwork/?sort=Trending", status: "ended", interaction: "Galxe and DC grind (earn XP, not just chatting)", help: "" },
            { id: 7, name: "BLOCKSTREET", link: "https://blockstreet.money/dashboard?invite_code=C9pffA", status: "ongoing", interaction: "Daily checkin", help: "" },
            { id: 8, name: "Edel", link: "https://testnet.edel.finance/access-code?code=V6SHM", status: "ongoing", interaction: "Make daily spin, and use the given asset to supply liq", help: "you have to buy the asset(EDEL TOKEN) on AERODROME" },
            { id: 9, name: "MAXSEE", link: "https://maxsee.io?k=E7674472", status: "ongoing", interaction: "SocialFi, refer and wait for allo", help: "" },
            { id: 10, name: "SovaBtc", link: "https://prime-beta.sova.io?ref=FHU84DVJ", status: "ongoing", interaction: "Testnet, suggesting interactions because it has a point system", help: "Swap to get more points" },
            { id: 11, name: "Linera", link: "https://portal.linera.net/quests", status: "ongoing", interaction: "Complete Quests", help: "https://t.me/AirdropAnalystChat/3770688?single" },
            { id: 12, name: "Inference Galxe", link: "https://app.galxe.com/quest/iRdLKduz7mKDAbgAMKGUNB/GCvBUtYiCQ?refer=space_home", status: "ongoing", interaction: "New task on the 21st, chat in discord once a day for 14 days", help: "" },
            { id: 13, name: "Inference zealy", link: "https://zealy.io/cw/inference", status: "ongoing", interaction: "Complete Quests", help: "" }, 
            { id: 14, name: "TBOOK", link: "https://engage.tbook.com/wise?referCode=ARRI8Y", status: "ongoing", interaction: "Minting SBTs, grinding DC is a advisable not a must", help: "Do task to gain more reputation" },
            { id: 15, name: "Flying Tulip", link: "https://flyingtulip.com/quiz/", status: "ongoing", interaction: "Do the tasks, Quiz", help: "Check the sheet to get the answers" },
            { id: 16, name: "Tessera", link: "https://tessera.fun/", status: "ongoing", interaction: "sign up on the waitlist using my code  PIFFER404", help: "" },
            { id: 17, name: "First dollar", link: "https://firstdollar.money/?r=sjRZLO", status: "ongoing", interaction: "sign up", help: "" }, 
            { id: 18, name: "Tanssi", link: "https://lfd.tanssi.network?referral=DV8XE9S8", status: "ongoing", interaction: "After doing the galxe lfd s3 task(which has ended), keep doing this campaign", help: "Not too late to join" }, 
            { id: 19, name: "Cedomis", link: "https://cedomis.xyz/dashboard", status: "ongoing", interaction: "use my code 'bitnomad' do all the tasks", help: "tasks are simple, ask ai" },
            { id: 20, name: "TrueNorth", link: "https://true-north.xyz/", status: "ongoing", interaction: "Sign up with my ref code E7F6F2", help: " AI agents for pro-level crypto insights" }, 
            { id: 21, name: "TruthTensor", link: "https://truthtensor.com/signup?ref=TRUTH-KTMC2KS9", status: "ongoing", interaction: "Daily task and quests", help: "check the google sheet" },
            { id: 22, name: "Citrea guild", link: "https://guild.xyz/citrea-community-journey/", status: "ongoing", interaction: "Getting lemons", help: "Inshort grind dc to get roles to get the lemons" },
        ];

        // --- COMPONENTS ---

        const StatusBadge = ({ status }) => {
            const normalized = status?.toLowerCase() || 'unknown';
            
            const styles = {
                ongoing: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
                waiting: "bg-amber-500/10 text-amber-400 border-amber-500/20",
                ended: "bg-red-500/10 text-red-400 border-red-500/20",
                dc: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20",
                quests: "bg-blue-500/10 text-blue-400 border-blue-500/20",
            };

            const defaultStyle = "bg-slate-700 text-slate-300 border-slate-600";
            
            const getIcon = () => {
                if (normalized.includes('ongoing')) return <IconRefresh className="w-3 h-3 mr-1 animate-spin-slow" />;
                if (normalized.includes('waiting')) return <IconClock className="w-3 h-3 mr-1" />;
                if (normalized.includes('ended')) return <IconCheck className="w-3 h-3 mr-1" />;
                return <IconAlert className="w-3 h-3 mr-1" />;
            };

            return (
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium border flex items-center w-fit capitalize ${styles[normalized] || defaultStyle}`}>
                {getIcon()}
                {status || 'Unknown'}
                </span>
            );
        };

        function AirdropPlaybook() {
            const [searchTerm, setSearchTerm] = useState('');
            const [filter, setFilter] = useState('All');

            const filteredData = useMemo(() => {
                return INITIAL_DATA.filter(item => {
                const matchesSearch = 
                    item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    item.interaction.toLowerCase().includes(searchTerm.toLowerCase());
                
                const matchesFilter = 
                    filter === 'All' ? true : 
                    filter === 'Ongoing' ? item.status.toLowerCase().includes('ongoing') :
                    filter === 'Waiting' ? item.status.toLowerCase().includes('waiting') :
                    filter === 'Other' ? !item.status.toLowerCase().includes('ongoing') && !item.status.toLowerCase().includes('waiting') : true;

                return matchesSearch && matchesFilter;
                });
            }, [searchTerm, filter]);

            const stats = useMemo(() => {
                return {
                total: INITIAL_DATA.length,
                ongoing: INITIAL_DATA.filter(i => i.status.toLowerCase().includes('ongoing')).length,
                waiting: INITIAL_DATA.filter(i => i.status.toLowerCase().includes('waiting')).length
                };
            }, []);

            return (
                <div className="min-h-screen pb-10">
                {/* Header Section */}
                <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                        <div className="bg-gradient-to-tr from-purple-600 to-blue-600 p-2 rounded-lg">
                        <IconRocket className="w-5 h-5 text-white" />
                        </div>
                        <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                        Alpha Playbook
                        </h1>
                    </div>
                    <div className="hidden sm:flex items-center gap-4 text-sm text-slate-400">
                        <span>{stats.total} Projects</span>
                        <span className="w-1 h-1 bg-slate-700 rounded-full"></span>
                        <span className="text-emerald-400">{stats.ongoing} Active</span>
                    </div>
                    </div>
                </header>

                    {/* Social Links Bar */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 flex justify-end gap-3">
                        <a 
                    href="https://twitter.com/block_piffer" 
                    target="_blank"
                    rel="noopener noreferrer"
                    className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-blue-400 transition-all"
                    aria-label="Twitter"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                        </a>
                        <a 
                        href="https://t.me/Bit_nomad001" 
                        target="_blank"
                        rel="noopener noreferrer"
                        className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-blue-400 transition-all"
                        aria-label="Telegram"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                        </svg>
                        </a>
                    </div>

                <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    
                    {/* NEW SECTION: Google Sheet Link */}
                    <div className="mb-8 p-4 rounded-xl bg-purple-900/10 border border-purple-500/20 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-purple-500/20 p-2 rounded-lg">
                                <IconSheet className="w-5 h-5 text-purple-400" />
                            </div>
                            <p className="text-slate-200 font-medium">for more info check the google sheet</p>
                        </div>
                        <a 
                            href="https://docs.google.com/spreadsheets/d/1X30hrx7LzcuRRCxCFVAvBeUNsvWdia_4bQ6FgvniHGs/edit?pli=1&gid=217040156#gid=217040156" 
                            target="_blank"
                            rel="noopener noreferrer"
                            className="text-sm font-semibold text-purple-400 hover:text-purple-300 flex items-center gap-2 transition-colors border border-purple-500/30 px-4 py-2 rounded-lg hover:bg-purple-500/10"
                        >
                            View Spreadsheet <IconExternalLink className="w-4 h-4" />
                        </a>
                    </div>

                    {/* Controls Section */}
                    <div className="flex flex-col md:flex-row gap-4 mb-8 justify-between items-start md:items-center">
                    
                    {/* Tabs */}
                    <div className="flex p-1 bg-slate-900 rounded-xl border border-slate-800 w-full md:w-auto overflow-x-auto">
                        {['All', 'Ongoing', 'Waiting', 'Other'].map((tab) => (
                        <button
                            key={tab}
                            onClick={() => setFilter(tab)}
                            className={`px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap ${
                            filter === tab 
                                ? 'bg-slate-800 text-white shadow-sm' 
                                : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                            }`}
                        >
                            {tab}
                        </button>
                        ))}
                    </div>

                    {/* Search Bar */}
                    <div className="relative w-full md:w-80 group">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <IconSearch className="h-4 w-4 text-slate-500 group-focus-within:text-purple-400 transition-colors" />
                        </div>
                        <input
                        type="text"
                        className="block w-full pl-10 pr-3 py-2.5 border border-slate-800 rounded-xl leading-5 bg-slate-900 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500/50 sm:text-sm transition-all"
                        placeholder="Search projects..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>
                    </div>

                    {/* Grid Display */}
                    {filteredData.length > 0 ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {filteredData.map((project) => (
                        <div 
                            key={project.id} 
                            className="group bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-purple-500/30 hover:shadow-lg hover:shadow-purple-900/10 transition-all duration-300 flex flex-col justify-between h-full"
                        >
                            <div>
                            <div className="flex justify-between items-start mb-3">
                                <h3 className="text-lg font-semibold text-white group-hover:text-purple-300 transition-colors">
                                {project.name}
                                </h3>
                                <StatusBadge status={project.status} />
                            </div>
                            
                            {project.help && (
                                <div className="mb-3 text-xs text-slate-500 font-mono bg-slate-950/50 p-2 rounded border border-slate-800/50">
                                ℹ️ {project.help}
                                </div>
                            )}

                            <div className="text-slate-400 text-sm leading-relaxed mb-4">
                                {project.interaction || "No specific interaction details provided."}
                            </div>
                            </div>

                            <div className="pt-4 border-t border-slate-800/50 mt-auto">
                            <a 
                                href={project.link}
                                target="_blank"
                                rel="noopener noreferrer" 
                                className="w-full flex items-center justify-center gap-2 py-2 px-4 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition-colors group/btn"
                            >
                                Open Project
                                <IconExternalLink className="w-3.5 h-3.5 group-hover/btn:translate-x-0.5 group-hover/btn:-translate-y-0.5 transition-transform" />
                            </a>
                            </div>
                        </div>
                        ))}
                    </div>
                    ) : (
                    <div className="flex flex-col items-center justify-center py-20 text-slate-500">
                        <IconFilter className="w-12 h-12 mb-4 opacity-20" />
                        <p className="text-lg font-medium">No airdrops found</p>
                        <p className="text-sm">Try adjusting your filters or search query.</p>
                    </div>
                    )}
                </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AirdropPlaybook />);
    </script>
</body>
</html>
